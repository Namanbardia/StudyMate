<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyMate AI — Learn Smarter. Plan Better. Achieve More.</title>
    <meta name="description" content="AI-powered learning platform that helps students discover quality learning resources, understand topics, organize study goals, and track progress." />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
    <!-- Prevent theme flash script -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('studymate_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || ((!stored || stored === 'system') && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-bg-base text-text-base antialiased min-h-screen selection:bg-accent/20 selection:text-text-base">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
